<!DOCTYPE html>
<html lang="fr" class="auth-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>Connexion — Mezz Admin</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
    <noscript><style>html.auth-pending{visibility:visible}</style></noscript>
</head>
<body class="login-page">
    <main class="login-card" aria-labelledby="login-title">
        <div class="login-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <h1 id="login-title">Administration</h1>
        <p>Accès réservé</p>

        <noscript><p class="login-error">JavaScript doit être activé pour se connecter.</p></noscript>
        <form id="login-form" method="post" action="/login/" novalidate>
            <label class="login-field" for="password">
                <span>Mot de passe</span>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    minlength="8"
                    required>
            </label>
            <button class="primary-button" id="login-submit" type="submit">
                <span>Se connecter</span>
            </button>
            <p class="login-error" id="login-error" role="alert" aria-live="polite"></p>
        </form>

        <a href="/" class="login-back">← Retour au site</a>
    </main>

    <script type="module" src="/js/login.js"></script>
</body>
</html>
